<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repository Gallery</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="repo.css">
</head>
<body>
  <div class="main">
    <h1>GitHub Repository Gallery</h1>

    <div class="search">
      <input type="text" id="github-username" placeholder="Enter GitHub username" />
      <button onclick="fetchRepositories()">Search</button>
    </div>

    <div id="repo-gallery" class="repo-gallery"></div>
  </div>

  <script src="apirepo.js"></script>
</body>
</html>
